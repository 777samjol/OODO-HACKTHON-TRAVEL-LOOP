<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveloop | Login</title>
  <meta name="description" content="Sign in to Traveloop — your vintage-inspired travel planning companion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      background-image: url('assets/vintage_bg.png');
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    /* vintage vignette overlay */
    .v-overlay {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(14,10,4,0.4) 0%, rgba(14,10,4,0.82) 100%);
    }
    .login-wrap { position: relative; z-index: 2; width: 100%; max-width: 400px; padding: 20px; }
    .login-panel {
      background: rgba(20,14,6,0.72);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      border: 1px solid rgba(220,185,120,0.15);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,235,180,0.12);
      position: relative; overflow: hidden;
    }
    .login-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,235,180,0.3), rgba(200,151,74,0.5), rgba(255,235,180,0.3), transparent);
    }
    /* Ambient glow inside panel */
    .login-panel::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(200,151,74,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px; position: relative; z-index: 1;
    }
    .login-logo .mark {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #c8974a, #8a5c28);
      border-radius: 12px; display: grid; place-items: center;
      box-shadow: 0 0 20px rgba(200,151,74,0.3), inset 0 1px 0 rgba(255,235,180,0.25);
    }
    .login-logo .mark svg { width: 20px; height: 20px; color: #0e0a04; }
    .login-logo .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700;
      background: linear-gradient(135deg, #e8c07a, #c8974a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-tagline {
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 28px; margin-left: 54px;
      position: relative; z-index: 1;
    }
    .login-headline {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700; margin-bottom: 5px;
      position: relative; z-index: 1;
    }
    .login-headline em { font-style: italic; color: var(--primary); }
    .login-sub { font-size: 13px; color: var(--text-3); margin-bottom: 28px; position: relative; z-index: 1; letter-spacing: 0.3px; }
    .social-row { display: flex; gap: 10px; margin-bottom: 18px; position: relative; z-index: 1; }
    .social-sign-btn {
      flex: 1; padding: 11px;
      background: rgba(200,151,74,0.06);
      border: 1px solid rgba(220,185,120,0.15);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--text-1);
      transition: all var(--trans);
    }
    .social-sign-btn:hover { background: rgba(200,151,74,0.12); border-color: var(--border-active); }
    .social-sign-btn svg { width: 17px; height: 17px; }
    .divider-text {
      text-align: center; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-3); margin: 18px 0; position: relative; z-index: 1;
    }
    .divider-text::before, .divider-text::after {
      content: ''; position: absolute; top: 50%;
      width: calc(50% - 54px); height: 1px; background: var(--border);
    }
    .divider-text::before { left: 0; } .divider-text::after { right: 0; }
    .login-form { position: relative; z-index: 1; }
    .full-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #c8974a, #8a5c28);
      color: #0e0a04; font-size: 14px; font-weight: 700;
      font-family: 'Outfit', sans-serif;
      border: none; border-radius: var(--radius-sm);
      transition: all var(--trans);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px; letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(200,151,74,0.25), inset 0 1px 0 rgba(255,235,180,0.2);
    }
    .full-btn:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,151,74,0.3); }
    .full-btn svg { width: 17px; height: 17px; }
    .login-footer { text-align: center; font-size: 12.5px; color: var(--text-3); margin-top: 22px; position: relative; z-index: 1; }
    .login-footer a { color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="v-overlay"></div>
  <div class="login-wrap">
    <div class="login-panel">
      <div class="login-logo">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        </div>
        <span class="brand-name">Traveloop</span>
      </div>
      <div class="login-tagline">Est. 2024 · Wander Wisely</div>
      <h1 class="login-headline">Welcome <em>back,</em></h1>
      <p class="login-sub">Continue your journey where you left off.</p>

      <div class="login-form">
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-with-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password" style="display:flex;justify-content:space-between">
              Password
              <a href="#" style="color:var(--primary);text-transform:none;letter-spacing:0;font-size:11px;font-weight:500">Forgot password?</a>
            </label>
            <div class="input-with-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>
          <button type="submit" class="full-btn" id="signInBtn">
            <span id="btnText">Sign In</span>
            <svg id="btnArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
      </div>
      <p class="login-footer">New here? <a href="home.html">Begin your journey →</a></p>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
